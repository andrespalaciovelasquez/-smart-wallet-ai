services:
  db:
    image: pgvector/pgvector:pg17
    container_name: smart_wallet_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_wallet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: